<svg xmlns="http://www.w3.org/2000/svg" class="cc-chart cc-chart--letters cc-chart--shorthand" viewBox="0 0 720 182" width="720" height="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" data-bars="8" data-lines="2" data-mode="letters" data-notation="shorthand"><style>.cc-chart {
  --cc-ink: #1a1a1a; --cc-muted: #7a8288; --cc-line: #444a4f; --cc-bg: transparent;
  --cc-part: #2c3e50; --cc-part-bg: #eef2f5; --cc-volta: #c0392b; --cc-annot: #8e44ad;
  --cc-correct: #1e8e3e; --cc-wrong: #c62828; --cc-missed: #ef6c00;
  --cc-active-tint: #e8f0fe; --cc-active-ink: #1558d6;
  --cc-selected-tint: #d7e3ff; --cc-selected-line: #1558d6;
  background: var(--cc-bg);
}
.cc-sym { fill: var(--cc-ink); font-weight: 700; }
.cc-qual, .cc-alt { font-weight: 600; }
.cc-bass { font-weight: 600; }
.cc-barline { stroke: var(--cc-line); stroke-width: 1.2; fill: none; }
.cc-barline--thick { fill: var(--cc-line); stroke: none; }
.cc-repeat-dot { fill: var(--cc-line); }
.cc-part { fill: var(--cc-part); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.cc-part-box { fill: var(--cc-part-bg); }
.cc-volta-bracket { stroke: var(--cc-volta); stroke-width: 1.2; fill: none; }
.cc-volta-num { fill: var(--cc-volta); font-size: 9px; font-weight: 700; }
.cc-barnum { fill: var(--cc-muted); font-size: 9px; }
.cc-rownum { fill: var(--cc-muted); font-size: 11px; font-weight: 700; }
.cc-annot { fill: var(--cc-annot); font-size: 11px; }
.cc-title { fill: var(--cc-ink); font-size: 15px; font-weight: 700; }
.cc-composer { fill: var(--cc-muted); font-size: 11px; }
.cc-chord.is-correct .cc-sym { fill: var(--cc-correct); }
.cc-chord.is-wrong .cc-sym { fill: var(--cc-wrong); }
.cc-chord.is-missed .cc-sym { fill: var(--cc-missed); }
.cc-chord.is-active .cc-sym { fill: var(--cc-active-ink); }
.cc-bar.is-active .cc-bar-hit, .cc-line.is-active-row .cc-bar-hit { fill: var(--cc-active-tint); }
.cc-chord.is-dim .cc-sym, .cc-bar.is-dim .cc-sym { opacity: .4; }
.cc-annot-entry { fill: var(--cc-ink); font-size: 11px; font-style: italic; }
.cc-chord.is-correct .cc-annot-entry { fill: var(--cc-correct); }
.cc-chord.is-wrong .cc-annot-entry { fill: var(--cc-wrong); }
.cc-chord.is-missed .cc-annot-entry { fill: var(--cc-missed); }
.cc-bar.is-selected .cc-bar-hit, .cc-chord.is-selected .cc-slot-hit {
  fill: var(--cc-selected-tint); stroke: var(--cc-selected-line); stroke-width: 1.5;
}
@media (prefers-color-scheme: dark) {
  .cc-chart {
    --cc-ink: #e8eaed; --cc-muted: #9aa0a6; --cc-line: #9aa0a6;
    --cc-part: #cfd8dc; --cc-part-bg: #2a2f34; --cc-volta: #ef9a9a; --cc-annot: #ce93d8;
    --cc-correct: #81c995; --cc-wrong: #f28b82; --cc-missed: #fcad70;
    --cc-active-tint: #253046; --cc-active-ink: #8ab4f8;
    --cc-selected-tint: #31405c; --cc-selected-line: #8ab4f8;
  }
}</style><g class="cc-section"><g class="cc-line" data-line="0" data-first-bar="0"><path class="cc-barline cc-barline--plain" data-after-bar="0" d="M12 27V83"/><path class="cc-barline cc-barline--plain" data-before-bar="0" data-after-bar="1" d="M186 27V83"/><path class="cc-barline cc-barline--plain" data-before-bar="1" data-after-bar="2" d="M360 27V83"/><path class="cc-barline cc-barline--plain" data-before-bar="2" data-after-bar="3" d="M534 27V83"/><path class="cc-barline cc-barline--plain" data-before-bar="3" d="M708 27V83"/><g class="cc-bar" id="cc-bar-0" data-bar="0" data-line="0" data-measure="9"><rect class="cc-bar-hit" x="12" y="27" width="174" height="56" fill="transparent"/><g class="cc-chord" id="cc-chord-0-0" data-bar="0" data-slot="0" data-units="1" data-label="F"><rect class="cc-slot-hit" x="12" y="27" width="174" height="56" fill="transparent"/><text class="cc-sym"><tspan class="cc-root" x="20" y="61.72" font-size="19">F</tspan></text></g></g><g class="cc-bar" id="cc-bar-1" data-bar="1" data-line="0" data-measure="10"><rect class="cc-bar-hit" x="186" y="27" width="174" height="56" fill="transparent"/><g class="cc-chord" id="cc-chord-1-0" data-bar="1" data-slot="0" data-units="1" data-label="B♭"><rect class="cc-slot-hit" x="186" y="27" width="174" height="56" fill="transparent"/><text class="cc-sym"><tspan class="cc-root" x="194" y="61.72" font-size="19">B♭</tspan></text></g></g><g class="cc-bar" id="cc-bar-2" data-bar="2" data-line="0" data-measure="11"><rect class="cc-bar-hit" x="360" y="27" width="174" height="56" fill="transparent"/><g class="cc-chord" id="cc-chord-2-0" data-bar="2" data-slot="0" data-units="1" data-label="C7"><rect class="cc-slot-hit" x="360" y="27" width="174" height="56" fill="transparent"/><text class="cc-sym"><tspan class="cc-root" x="368" y="61.72" font-size="19">C</tspan><tspan class="cc-qual" x="382.44" y="63.24" font-size="15.58">7</tspan></text></g></g><g class="cc-bar" id="cc-bar-3" data-bar="3" data-line="0" data-measure