="cc-qual" x="209.58" y="142.24" font-size="15.58">7</tspan></text></g></g><g class="cc-bar" id="cc-bar-6" data-bar="6" data-line="1" data-measure="15"><rect class="cc-bar-hit" x="360" y="106" width="174" height="56" fill="transparent"/><g class="cc-chord" id="cc-chord-6-0" data-bar="6" data-slot="0" data-units="1" data-label="C7"><rect class="cc-slot-hit" x="360" y="106" width="174" height="56" fill="transparent"/><text class="cc-sym"><tspan class="cc-root" x="368" y="140.72" font-size="19">C</tspan><tspan class="cc-qual" x="382.44" y="142.24" font-size="15.58">7</tspan></text></g></g><g class="cc-bar" id="cc-bar-7" data-bar="7" data-line="1" data-measure="16"><rect class="cc-bar-hit" x="534" y="106" width="174" height="56" fill="transparent"/><text class="cc-barnum" x="537" y="102">16</text><g class="cc-chord" id="cc-chord-7-0" data-bar="7" data-slot="0" data-units="1" data-label="F"><rect class="cc-slot-hit" x="534" y="106" width="174" height="56" fill="transparent"/><text class="cc-sym"><tspan class="cc-root" x="542" y="140.72" font-size="19">F</tspan></text></g></g></g></g></svg>